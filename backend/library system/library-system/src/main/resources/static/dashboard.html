<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <h2>📚 Library Admin</h2>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="books.html">Manage Books</a>
        <a href="members.html">Manage Members</a>
        <a href="issue-return.html">Issue / Return</a>
        <a href="reservations.html">Reservations</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</nav>

<main class="container">
    <h1>Admin Dashboard</h1>

    <div class="grid">
        <div class="stat">
            <h3>Total Books</h3>
            <p id="totalBooks">0</p>
        </div>
        <div class="stat">
            <h3>Total Members</h3>
            <p id="totalMembers">0</p>
        </div>
        <div class="stat">
            <h3>Active Issues</h3>
            <p id="totalIssued">0</p>
        </div>
        <div class="stat">
            <h3>Returned Books</h3>
            <p id="totalReturned">0</p>
        </div>
        <div class="stat">
            <h3>Fine Collected</h3>
            <p id="totalFine">₹0</p>
        </div>
    </div>

    <div class="card">
        <h2>Quick Actions</h2>
        <p><a href="books.html">Manage Books</a></p>
        <p><a href="members.html">Manage Members</a></p>
        <p><a href="issue-return.html">Issue or Return Book</a></p>
        <p><a href="reservations.html">Manage Reservations</a></p>
    </div>

    <p id="message" class="message"></p>
</main>

<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
