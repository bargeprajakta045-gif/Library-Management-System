<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <h2>📚 Library Admin</h2>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="books.html">Books</a>
        <a href="members.html">Members</a>
        <a href="issue-return.html">Issue / Return</a>
        <a href="reservations.html">Reservations</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</nav>

<main class="container">
    <h1>Manage Books</h1>

    <div class="card">
        <h2 id="formTitle">Add New Book</h2>

        <form id="bookForm">
            <input type="hidden" id="bookId">

            <div class="form-grid">
                <div class="form-group">
                    <label>Book Name</label>
                    <input id="bookName" required>
                </div>

                <div class="form-group">
                    <label>Author</label>
                    <input id="author" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <input id="category">
                </div>

                <div class="form-group">
                    <label>ISBN</label>
                    <input id="isbn" required>
                </div>

                <div class="form-group">
                    <label>Quantity</label>
                    <input id="quantity" type="number" min="0" required>
                </div>

                <div class="form-group">
                    <label>Available Quantity</label>
                    <input id="availableQuantity" type="number" min="0" required>
                </div>

                <button type="submit" class="btn-success">Save Book</button>
                <button type="button" class="btn-secondary" onclick="resetBookForm()">
                    Clear
                </button>
            </div>
        </form>

        <p id="message" class="message"></p>
    </div>

    <div class="card">
        <h2>All Books</h2>

        <input class="search-box" id="searchInput"
               placeholder="Search by name, author, category or ISBN">

        <button onclick="searchBooks()">Search</button>
        <button class="btn-secondary" onclick="loadBooks()">Show All</button>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Book Name</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>ISBN</th>
                        <th>Quantity</th>
                        <th>Available</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="booksTable"></tbody>
            </table>
        </div>
    </div>
</main>

<script src="js/app.js"></script>
<script src="js/books.js"></script>
</body>
</html>
