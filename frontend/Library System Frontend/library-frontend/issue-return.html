<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue and Return Books</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <h2>📚 Library Admin</h2>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="books.html">Books</a>
        <a href="members.html">Members</a>
        <a href="issue-return.html">Issue / Return</a>
        <a href="reservations.html">Reservations</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</nav>

<main class="container">
    <h1>Issue / Return Book</h1>

    <div class="card">
        <h2>Issue a Book</h2>

        <form id="issueForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Select Book</label>
                    <select id="bookId" required></select>
                </div>

                <div class="form-group">
                    <label>Select Member</label>
                    <select id="memberId" required></select>
                </div>

                <button type="submit" class="btn-success">Issue Book</button>
            </div>
        </form>

        <p id="message" class="message"></p>
    </div>

    <div class="card">
        <h2>All Issue Records</h2>

        <button onclick="loadIssues()">Refresh</button>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Issue ID</th>
                        <th>Book</th>
                        <th>Member</th>
                        <th>Issue Date</th>
                        <th>Due Date</th>
                        <th>Return Date</th>
                        <th>Fine</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="issuesTable"></tbody>
            </table>
        </div>
    </div>
</main>

<script src="js/app.js"></script>
<script src="js/issue-return.js"></script>
</body>
</html>
